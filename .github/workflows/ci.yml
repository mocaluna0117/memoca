name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generated Convex client is committed; regenerating it here catches a
      # schema change that was pushed without the types that go with it.
      - name: Check the generated Convex client is current
        run: |
          npx convex codegen --typecheck disable || true
          git diff --exit-code convex/_generated

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://example.convex.site
