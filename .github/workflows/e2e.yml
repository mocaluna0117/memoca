name: E2E

# The Playwright suite, against a production build and a Convex deployment of
# its own (dev/e2e-ci, sincere-tern-242), never the one `npx convex dev` uses.
#
# By hand from the Actions tab, and once a week. Not on every push: Convex's
# free plan caps the whole team, production included, at 1M function calls
# and 1 GB of database I/O a month, and one full run takes some 20k calls.
# Past the cap, production's own writes can fail.

on:
  workflow_dispatch:
  schedule:
    # Sundays 19:00 UTC: Monday 04:00 in Japan, after the weekly Convex crons.
    - cron: "0 19 * * 0"

# One run at a time: they share the deployment.
concurrency:
  group: e2e
  cancel-in-progress: false

env:
  NEXT_PUBLIC_CONVEX_URL: https://sincere-tern-242.convex.cloud
  NEXT_PUBLIC_CONVEX_SITE_URL: https://sincere-tern-242.convex.site

jobs:
  deploy:
    name: Push the functions to the E2E deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The version is package.json's packageManager; naming one here as
      # well stops the step.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx convex dev --once
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}

  e2e:
    name: Playwright (${{ matrix.shard }}/4)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WebKit for the Mac desktop app's engine (e2e/ime-commit.spec.ts).
      - run: npx playwright install --with-deps chromium webkit
      - run: pnpm build

      - name: Start the site
        run: |
          pnpm start > server.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100 && exit 0; sleep 1; done
          cat server.log
          exit 1

      - name: Run the suite's share
        run: npx playwright test --shard=${{ matrix.shard }}/4 --workers=2
        env:
          E2E_BASE_URL: http://localhost:3100

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            test-results/
            server.log
          retention-days: 14

  clean-up:
    name: Delete the accounts the run made
    needs: [deploy, e2e]
    # Whatever the suite's outcome: the accounts are made either way.
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # convex/testData.ts: E2E accounts only, and only where TEST_DATA_WIPE is set.
      - run: npx convex run testData:wipe
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_E2E }}
