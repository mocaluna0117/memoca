[package]
name = "memoca"
version = "0.4.2"
description = "Memoca のデスクトップ版：即席メモの窓"
authors = ["mocaluna0117"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
tauri-plugin-window-state = "2"

# Kept out of Alt-Tab: the window's extended style (window.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# Touch ID (device_unlock.rs): asked by the app, the secret kept in the keychain.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSURL"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"
security-framework = "3"
# Images copied as files (clipboard.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }
# Windows Hello (device_unlock.rs): a key of its own, the secret its signature.
windows = { version = "0.61", features = ["Security_Credentials", "Security_Cryptography", "Storage_Streams", "Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
